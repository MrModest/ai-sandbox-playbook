onboarding = false

[theme]
name = "one-dark"

[keys]
prefix = "ctrl+b"

new_workspace = "prefix+n"
new_tab = "prefix+t"

next_tab = "ctrl+tab"
previous_tab = "ctrl+shift+tab"

next_workspace = "ctrl+alt+tab"
previous_workspace = "ctrl+alt+shift+tab"

[ui]
prompt_new_tab_name = true
show_agent_labels_on_pane_borders = true

agent_panel_sort = "spaces"
[ui.toast]
delivery = "system"

[ui.sound]
enabled = true
