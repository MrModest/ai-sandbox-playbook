---
# ~/.agents/skills is the one shared skills dir. Codex and Pi read it natively;
# Claude doesn't, so each skill gets a symlink in ~/.claude/skills.
- name: Create agent config dirs
  ansible.builtin.file:
    path: "{{ home }}/{{ item }}"
    state: directory
    mode: "0755"
  loop: [.agents, .claude]

- name: Copy agent skills
  ansible.builtin.copy:
    src: skills/
    dest: "{{ home }}/.agents/skills/"
    mode: preserve

- name: Copy Claude skills link script
  ansible.builtin.copy:
    src: link-claude-skills.sh
    dest: "{{ home }}/.agents/link-claude-skills.sh"
    mode: "0755"

# Also runs as a Claude SessionStart hook, so new skills get linked without a playbook run.
- name: Link each agent skill into Claude skills
  ansible.builtin.command: "{{ home }}/.agents/link-claude-skills.sh"
  changed_when: false
