---
- name: Install nvm and Node.js
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/{{ nodejs_nvm_version }}/install.sh | bash
    . "$NVM_DIR/nvm.sh"
    nvm install {{ node_version }}
    nvm alias default {{ node_version }}
  args:
    executable: /bin/bash
    creates: "{{ node_bin }}/node"
  environment:
    NVM_DIR: "{{ home }}/.nvm"

- name: Check pnpm version
  ansible.builtin.command: pnpm --version
  register: nodejs_pnpm_current
  changed_when: false
  failed_when: false

# Versions are minimums: install when missing or older, never downgrade a newer one.
- name: Enable pnpm via corepack
  ansible.builtin.shell: "corepack enable && corepack prepare pnpm@{{ nodejs_pnpm_version }} --activate"
  when: (nodejs_pnpm_current.stdout or '0') is version(nodejs_pnpm_version, '<')
  changed_when: true

- name: List global npm packages
  ansible.builtin.command: "{{ node_bin }}/npm ls --global --depth=0 --json"
  register: nodejs_npm_ls
  changed_when: false
  failed_when: false # exits 1 on extraneous/invalid trees; the JSON is still usable

- name: Install global npm packages
  community.general.npm:
    name: "{{ item.name }}"
    version: "{{ item.version }}"
    ignore_scripts: "{{ item.ignore_scripts | default(false) }}"
    global: true
    executable: "{{ node_bin }}/npm"
  loop: "{{ nodejs_npm_globals }}"
  when: (nodejs_npm_installed[item.name].version | default('0')) is version(item.version, '<')
  vars:
    nodejs_npm_installed: "{{ (nodejs_npm_ls.stdout | default('{}', true) | from_json).dependencies | default({}) }}"

- name: Install agent-browser's Chrome
  ansible.builtin.command: agent-browser install
  args:
    creates: "{{ home }}/.agent-browser/browsers"
