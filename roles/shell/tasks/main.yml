---
- name: Install zsh and prompt dependencies
  become: true
  ansible.builtin.apt:
    name: [curl, zsh, zsh-autosuggestions, zsh-syntax-highlighting, fzf, zoxide, eza]

- name: Install starship
  ansible.builtin.shell: >-
    set -o pipefail && curl -fsSL https://starship.rs/install.sh
    | sh -s -- --yes --bin-dir {{ local_bin }} --version {{ shell_starship_version }}
  args:
    executable: /bin/bash
    creates: "{{ local_bin }}/starship"

- name: Copy starship config
  ansible.builtin.copy:
    src: starship.toml
    dest: "{{ home }}/.config/starship.toml"
    mode: "0644"

- name: Create zsh data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ home }}/.config/zsh"
    - "{{ home }}/.cache"
    - "{{ home }}/.local/share"
    - "{{ home }}/.local/state"
    - "{{ home }}/.xdg"

- name: Copy zsh config
  ansible.builtin.copy:
    src: zshrc
    dest: "{{ home }}/.zshrc"
    mode: "0644"

- name: Set zsh as the login shell
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    shell: /usr/bin/zsh
