---
- name: Install starship and ble.sh dependencies
  become: true
  ansible.builtin.apt:
    name: [curl, git, make, gawk]

- name: Install starship
  ansible.builtin.shell: >-
    set -o pipefail && curl -fsSL https://starship.rs/install.sh
    | sh -s -- --yes --bin-dir {{ local_bin }} --version {{ shell_starship_version }}
  args:
    executable: /bin/bash
    creates: "{{ local_bin }}/starship"

- name: Copy starship config
  ansible.builtin.copy:
    src: starship.toml
    dest: "{{ home }}/.config/starship.toml"
    mode: "0644"

- name: Clone ble.sh
  ansible.builtin.git:
    repo: https://github.com/akinomyoga/ble.sh.git
    dest: "{{ home }}/.cache/ble.sh-src"
    version: "{{ shell_blesh_commit }}"
  notify: Build and install ble.sh

# ble.sh must be sourced at the very top of .bashrc and attached at the very bottom.
- name: Load ble.sh at top of .bashrc
  ansible.builtin.blockinfile:
    path: "{{ home }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED: ble.sh load"
    insertbefore: BOF
    block: |
      [[ $- == *i* ]] && source -- ~/.local/share/blesh/ble.sh --attach=none

- name: Init starship and attach ble.sh at bottom of .bashrc
  ansible.builtin.blockinfile:
    path: "{{ home }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED: prompt"
    insertafter: EOF
    block: |
      eval "$(starship init bash)"
      [[ ! ${BLE_VERSION-} ]] || ble-attach

- name: Copy ble.sh config
  ansible.builtin.copy:
    src: blerc
    dest: "{{ home }}/.blerc"
    mode: "0644"
